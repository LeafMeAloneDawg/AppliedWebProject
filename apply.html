<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Xander Rode-Bramanis">
    <meta name="keywords" content="job application, employment, careers, volunteering">
    <meta name="description" content="a job application page for a not-for-profit organisation">
    <title>Application Page</title>
</head>

<body>

<!-- This is the form for the job application page. -->
<form action="http://mercury.swin.edu.au/it000000/formtest.php" method="post">

<!-- Job Reference Number fieldset. -->
    <fieldset>
        <label for="job_reference_number">Job Reference Number:</label>
        <input type="text" id="job_reference_number" name="job_reference_number" 
        placeholder="ABC123" pattern="[A-Za-z0-9]{6}" required>
    </fieldset>

<!-- First Name fieldset. -->
    <fieldset>
        <label for="first_name">First Name:</label>
        <input type="text" id="first_name" name="first_name" placeholder="John" 
        pattern="[A-Za-z]{1,20}" required>
    </fieldset>


</form>

</body>
