<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Xander Rode-Bramanis">
    <meta name="keywords" content="job application, employment, careers, volunteering">
    <meta name="description" content="a job application page for a not-for-profit organisation">
    <title>Application Page</title>
</head>

<body>

<!-- This is the form for the job application page. -->
<form action="http://mercury.swin.edu.au/it000000/formtest.php" method="post">

<!-- Job Reference Number fieldset. -->
    <fieldset>
        <label for="job_reference_number">Job Reference Number:</label>
        <input type="text" id="job_reference_number" name="job_reference_number" 
        placeholder="ABC123" pattern="[A-Za-z0-9]{6}" required>
    </fieldset>

<!-- First Name fieldset. -->
    <fieldset>
        <legend>Personal Details</legend>
        <label for="first_name">First Name:</label>
        <input type="text" id="first_name" name="first_name" placeholder="John" 
        pattern="[A-Za-z]{1,20}" required>
    <br>
<!-- Last Name fieldset. -->
    <br>
        <label for="last_name">Last Name:</label>
        <input type="text" id="last_name" name="last_name" placeholder="Doe" 
        pattern="[A-Za-z]{1,20}" required>
    <br>
<!-- Date of Birth fieldset. -->
    <br>
        <label for="Date_of_Birth">Date of Birth:</label>
        <input type="text" id="Date_of_Birth" name="Date_of_Birth" placeholder="dd/mm/yyyy" 
        pattern="(0[1-9]|[12][0-9]|3[01])/(0[1-9]|1[0-2])/[0-9]{4}">
    </fieldset>

<!-- Gender fieldset. -->

    <fieldset>
    <legend>Gender</legend>
    <input type="radio" id="male" name="gender" value="male">
        <label for="male">Male</label>

    <input type="radio" id="female" name="gender" value="female">
        <label for="female">Female</label>

    <input type="radio" id="other" name="gender" value="other">
        <label for="other">Other</label>
    </fieldset>


</form>

</body>
